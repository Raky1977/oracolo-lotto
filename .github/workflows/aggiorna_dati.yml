name: Aggiorna estrazioni Lotto

on:
  schedule:
    # Lotto: mar/gio/ven/sab ore 20:00 italiane. GitHub usa UTC.
    # Finestra ripetuta per assorbire ritardi di pubblicazione e cambio ora legale.
    - cron: '10,40 18-20 * * 2,4,5,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_lotto_adm.py
      - name: Commit solo se ci sono nuovi dati
        run: |
          git config user.name "lotto-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add estrazioni_recenti.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna estrazioni Lotto"
          git push
