name: Aggiorna estrazioni Lotto

on:
  schedule:
    # Lotto: martedi, giovedi, venerdi, sabato.
    # GitHub cron usa UTC.
    # Controlli serali multipli per coprire eventuali ritardi
    # nell'aggiornamento dello ZIP della sorgente.
    - cron: '15,45 18-22 * * 2,4,5,6'

    # Controllo di recupero la mattina successiva.
    # Domenica, mercoledi, venerdi, sabato.
    - cron: '30 6 * * 0,3,5,6'

  # Permette anche l'avvio manuale da GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install requests

      - name: Scarica estrazioni e genera dati
        run: python scripts/update_lotto_zip.py

      - name: Verifica estrazioni JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('estrazioni_recenti.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          assert isinstance(data, list) and data
          assert len(data[0]['ruote']) == 11

          print(
              'Ultima estrazione:',
              data[0]['data'],
              '- estrazioni pubblicate:',
              len(data)
          )
          PY

      - name: Verifica editoriale JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('articoli.json')

          assert p.exists(), "articoli.json non trovato"

          data = json.loads(p.read_text(encoding='utf-8'))

          assert isinstance(data, list)
          assert data, "articoli.json e vuoto"

          ultimo = data[0]

          assert 'id' in ultimo
          assert 'data' in ultimo
          assert 'titolo' in ultimo
          assert 'anteprima' in ultimo
          assert 'contenuto' in ultimo

          print(
              'Ultimo editoriale:',
              ultimo['data'],
              '-',
              ultimo['titolo']
          )
          PY

      - name: Commit solo se cambia
        run: |
          git config user.name "lotto-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add estrazioni_recenti.json articoli.json

          if git diff --cached --quiet; then
            echo "Nessuna nuova estrazione o editoriale."
            exit 0
          fi

          git commit -m "Aggiorna estrazioni Lotto e editoriale"
          git push
